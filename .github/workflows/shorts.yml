name: Auto Shorts
on:
  schedule:
    # 14:17 UTC = 20:17 Bangladesh time. Avoids the busy top of the hour.
    - cron: '17 14 * * *'
  workflow_dispatch:
    inputs:
      privacy:
        description: Upload visibility (test with private first)
        type: choice
        options: [private, unlisted, public]
        default: private
      preview_only:
        description: Render a silent 6-second sample without calling APIs or uploading to YouTube
        type: boolean
        default: true
      reset_token:
        description: Replace saved token using YOUTUBE_REFRESH_TOKEN secret
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: auto-shorts-publisher
  cancel-in-progress: false
jobs:
  publish:
    # Scheduled publishing is OFF until repository variable ENABLE_SCHEDULE is true.
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_SCHEDULE == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: '1'
      DATA_DIR: /tmp/autoshorts
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
      MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
      MYSQL_USER: ${{ secrets.MYSQL_USER }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      MYSQL_DATABASE: ${{ vars.MYSQL_DATABASE || 'defaultdb' }}
      MYSQL_SSL_CA: ${{ secrets.MYSQL_SSL_CA }}
      NICHE: ${{ vars.NICHE || 'Short cheerful fictional cartoon adventures for children aged 4–8, teaching kindness and sharing with a happy ending' }}
      LANGUAGE: ${{ vars.LANGUAGE || 'bn' }}
      UPLOAD_PRIVACY: ${{ inputs.privacy || vars.UPLOAD_PRIVACY || 'private' }}
      MADE_FOR_KIDS: ${{ vars.MADE_FOR_KIDS || 'true' }}
      CONTAINS_SYNTHETIC_MEDIA: ${{ vars.CONTAINS_SYNTHETIC_MEDIA || 'false' }}
      TTS_MODEL: ${{ vars.TTS_MODEL || 'gemini-3.8-flash-lite-tts' }}
      TTS_VOICE: ${{ vars.TTS_VOICE || 'Kore' }}
      TTS_SECOND_VOICE: ${{ vars.TTS_SECOND_VOICE || 'Puck' }}
      TTS_MAX_ATTEMPTS: '1'
      RESET_YOUTUBE_TOKEN: ${{ inputs.reset_token || 'false' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Blender, fonts and encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender ffmpeg fonts-noto-core
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Render sample without API calls
        if: github.event_name == 'workflow_dispatch' && inputs.preview_only
        run: python scripts/preview_3d.py
      - name: Downloadable preview
        if: github.event_name == 'workflow_dispatch' && inputs.preview_only
        uses: actions/upload-artifact@v4
        with:
          name: cartoon-3d-preview
          path: /tmp/autoshorts/preview.mp4
          retention-days: 3
          if-no-files-found: error
      - name: Generate and publish one Short
        if: github.event_name != 'workflow_dispatch' || !inputs.preview_only
        run: python -m autoshorts.cli
      - name: Delete all temporary media
        if: always()
        run: rm -rf /tmp/autoshorts
